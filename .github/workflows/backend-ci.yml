# Memoir — Backend CI
#
# Runs on the `backend/` git repo. Everything here is a gate that must pass
# before a merge, and the reasons are in the job names and the comments: each
# check corresponds to an invariant that has actually been broken in this
# codebase.
#
# Design notes worth knowing before editing:
#
#   * No service credentials in CI. The `live` tests are skipped, not faked.
#     Asserting a database invariant against a mock proves nothing about the
#     database, and a test that passes without a database is worse than no test.
#   * Parallelism is deliberately conservative. The Windows-free Linux runner is
#     the only place this is verified, and a suite that flakes under parallelism
#     erodes trust in the whole gate.
#   * The migration check does not apply anything. It verifies the chain is
#     coherent and that models match migrations. Applying to a real database is
#     an operator step (see deploy/README.md section 3), because two revisions in
#     the chain are not idempotent.

name: backend-ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# A new push to the same branch makes the in-flight run irrelevant. Without this
# a queue of stale runs burns minutes on commits nobody will ship.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback: the suite has no external dependencies, so this is first
  # and runs without any setup beyond the interpreter.
  # ---------------------------------------------------------------------
  test:
    name: tests (unit + offline contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only. Kept out of requirements.txt so the production image does
          # not carry a test runner.
          pip install pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Verify every module imports
        working-directory: backend
        # Catches the failure mode that unit tests miss: a module that cannot be
        # imported at all. `src/integrations/user.py` was a stale duplicate
        # referencing a module that no longer existed; nothing imported it, so
        # nothing failed until the day someone did.
        run: python _import_check.py

      - name: Model/migration DDL parity
        working-directory: backend
        # The highest-consequence check in this file. Models and migrations
        # drifting means the next `--autogenerate` emits a DROP TABLE for a table
        # in active use -- and Alembic compares models to the *database*, so the
        # symptom appears one revision too late.
        run: python _ddl_parity_check.py

      - name: Run tests
        working-directory: backend
        env:
          # `conftest.py` installs placeholders via setdefault, so these are
          # belt-and-braces. They exist so a stray real credential in a fork's
          # environment cannot reach a test that makes no network call anyway.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
          READER_JWT_SECRET: ci-placeholder-not-used
          ASSEMBLYAI_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder
          DEEPGRAM_API_KEY: ci-placeholder
        run: |
          pytest -q \
            -m "not live" \
            --junitxml=pytest-report.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # The schema gate. Separate from `test` because it is fast, it needs no
  # database, and it is the check that must never be skipped when someone is in
  # a hurry to ship a migration.
  # ---------------------------------------------------------------------
  migrations:
    name: alembic chain integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Exactly one head
        working-directory: backend
        # Two heads means two migration paths applied to one database and Alembic
        # cannot resolve which is correct. `alembic heads` exits 0 in that case,
        # so it is asserted rather than eyeballed.
        run: |
          heads=$(alembic heads 2>/dev/null | grep -oE '^[0-9a-f]{12}' | sort -u)
          count=$(echo "$heads" | grep -c . || true)
          echo "heads: $heads"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one migration head, found $count"
            exit 1
          fi

      - name: The whole chain renders to SQL offline
        working-directory: backend
        # Proves every revision is syntactically valid and that nothing in the
        # chain requires a live connection to generate. Does NOT apply anything.
        run: alembic upgrade head:head --sql > /dev/null

      - name: No revision edits an applied migration
        working-directory: backend
        # Root AGENTS.md section 7: applied migrations are history. Detected by
        # comparing against the default branch, which is the only reliable
        # record of what has already run somewhere.
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref || 'main' }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" -- alembic/versions/ || true)
          if [ -n "$changed" ]; then
            edited=$(echo "$changed" | xargs -I{} git diff --numstat "origin/${{ github.base_ref || 'main' }}...HEAD" -- {} | awk '$1 != 0 || $2 != 0 {print $3}')
            if [ -n "$edited" ]; then
              echo "::error::Applied migrations were modified: $edited"
              echo "Append a new revision instead. Editing one that has run breaks every environment that is already past it."
              exit 1
            fi
            echo "New revision(s) added: $changed"
          fi

      - name: The guarded runner's safe set matches the real chain
        working-directory: backend
        # `scripts/migrate.py` refuses to advance from a revision it cannot prove
        # is safe, because cd3760273110 does DROP COLUMN + ADD COLUMN and
        # re-running it erases every organize run. If the safe set and the chain
        # drift apart, that protection silently stops protecting.
        run: pytest -q tests/test_migrations.py -m "not live"

  # ---------------------------------------------------------------------
  # The container. Builds the image so a broken Dockerfile is caught here
  # rather than during a deploy at 22:00.
  # ---------------------------------------------------------------------
  container:
    name: docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        # No `working-directory` here. That key is only valid on a `run:` step --
        # GitHub's schema rejects it on a `uses:` step, and the resulting error
        # ("Required property is missing: run") points at the wrong line entirely.
        # `context` below is how a `uses:` step selects its directory.
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: memoir-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image does not carry a .env
        working-directory: backend
        # Secrets in an image layer survive every later push to a registry. This
        # is checked by inspection of the build context rules rather than by
        # scanning the image, because a secret that was never sent to the daemon
        # cannot be in the result.
        run: |
          if grep -vE '^\s*(#|!|$)' .dockerignore | grep -qE '^\.env$'; then
            echo "OK: .env is excluded from the build context"
          else
            echo "::error::.dockerignore does not exclude .env; a real .env would be baked into an image layer"
            exit 1
          fi

      - name: The image refuses to boot with no secrets
        # Invariant 8: fail fast at boot. A missing secret must crash the process,
        # not surface as a confusing failure on a user's request hours later.
        # Asserted by expecting a NON-ZERO exit with a specific message.
        run: |
          set +e
          output=$(docker run --rm memoir-backend:ci python -c "import src.main" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::the image booted with no configuration; a missing secret must fail at startup"
            exit 1
          fi
          echo "Boot refused as required:"
          echo "$output" | tail -5

      - name: The image serves /health without any configuration
        # Liveness must not need a database. If it did, a database blip would
        # mark every task unhealthy and ECS would replace all of them -- a
        # thundering herd that cannot help.
        run: |
          set +e
          container=$(docker run -d --name ci-health -p 8000:8000 \
            -e SUPABASE_URL=http://127.0.0.1:54321 \
            -e SUPABASE_ANON_KEY=placeholder \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -e SUPABASE_JWKS_URL=http://127.0.0.1:54321/auth/v1/.well-known/jwks.json \
            -e READER_JWT_SECRET=ci-placeholder \
            -e ASSEMBLYAI_API_KEY=placeholder \
            -e GEMINI_API_KEY=placeholder \
            -e CORS_ORIGINS=https://example.com \
            -e COOKIE_SECURE=true \
            -e COOKIE_SAMESITE=none \
            memoir-backend:ci)
          set -e

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "OK: /health responded on attempt $i"
              curl -fsS http://127.0.0.1:8000/health
              docker rm -f ci-health
              exit 0
            fi
            sleep 1
          done

          echo "::error::the container never served /health"
          docker logs ci-health || true
          docker rm -f ci-health || true
          exit 1

      - name: The image does not migrate on startup
        # The single most dangerous thing that could be added to the Dockerfile.
        # Two revisions in the chain drop and re-add columns; running them on boot
        # turns a routine deploy into data loss with no rollback.
        run: |
          if grep -iE '^CMD.*(alembic|migrate\.py)' Dockerfile; then
            echo "::error::the Dockerfile runs migrations at startup; see deploy/README.md section 3"
            exit 1
          fi
          echo "OK: migrations are an explicit step, not a startup step"

  # ---------------------------------------------------------------------
  # Live-database invariants, run on a real Postgres rather than mocked.
  #
  # Only the invariants that are structurally impossible to verify offline:
  # that a trigger FIRES, that a partial unique index is enforced, that
  # `server_default` fires. A mock asserts that our code calls what we think it
  # calls; only a real database says whether the constraint is there.
  #
  # Job-level `if` so a fork's pull request skips it cleanly instead of failing
  # for missing secrets -- while the main repo still gates on it.
  # ---------------------------------------------------------------------
  database-invariants:
    name: live database invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres, not Supabase. The constraints under test (partial unique
    # indexes, CHECK constraints, server defaults) behave identically, and
    # service-role credentials never have to exist outside AWS.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Build the core schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memoir_test
        # The bootstrap SQL is the intended path for a database that did not
        # come from Alembic (it is what Supabase projects are built from), and
        # it creates the parent tables the new revisions reference.
        run: |
          python - <<'PY'
          import os
          import psycopg

          ddl = open("migrations/0000_bootstrap_sandbox_schema.sql", encoding="utf-8").read()
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              conn.execute(ddl)
          print("bootstrap schema applied")
          PY

      - name: Apply the revision chain
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memoir_test
        # Runs the guarded runner, not a bare `upgrade head`, so this job
        # exercises the same code path an operator will use.
        run: python scripts/migrate.py

      - name: Assert the database is at head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memoir_test
        run: python scripts/migrate.py --check

      - name: Run the live tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memoir_test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
          READER_JWT_SECRET: ci-placeholder-not-used
          ASSEMBLYAI_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder
          DEEPGRAM_API_KEY: ci-placeholder
        run: pytest -q -m live --junitxml=live-report.xml

      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-db-report
          path: backend/live-report.xml
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Runs last and only for the default branch. Deploys on merge, not on PR:
  # a preview environment would need its own migration run, and the guard in
  # scripts/migrate.py exists precisely because that is not a thing to do
  # casually.
  # ---------------------------------------------------------------------
  build-image:
    name: build and push image
    runs-on: ubuntu-latest
    needs: [test, migrations, container, database-invariants]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # ECR login via OIDC; no long-lived AWS keys in the repo.

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/memoir-backend-ci
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/memoir-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Backend image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Not deployed.** Promotion is a deliberate operator step:"
            echo ""
            echo '```bash'
            echo "aws ecs run-task --cluster memoir --launch-type FARGATE \\"
            echo "  --task-definition memoir-backend \\"
            echo "  --overrides '{\"containerOverrides\":[{\"name\":\"api\",\"command\":[\"python\",\"scripts/migrate.py\"]}]}'"
            echo "```"
            echo ""
            echo "Wait for exit code 0, then update the service. See deploy/README.md section 3."
          } >> "$GITHUB_STEP_SUMMARY"
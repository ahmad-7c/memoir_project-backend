name: Test and deploy to Lightsail

# Pushes to main go live automatically once tests pass. There is no separate
# "staging" gate here by design -- the user asked for features to go live
# directly after tests pass, not for a second manual approval step.
#
# Migrations are the one place this pipeline is deliberately NOT a blind
# `alembic upgrade head`: it runs scripts/migrate.py, the guarded runner this
# repo already has (see deploy/README.md section 3). That script refuses to
# advance from any revision it can't prove is safe, so running it
# unattended in CI is safe by construction -- the guard IS the safety
# mechanism, not a human watching the terminal.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Two deploys racing against the same Lightsail service is a lost update on
  # whichever finishes second, so they must not overlap -- but they QUEUE
  # rather than cancel.
  #
  # cancel-in-progress: true was actively harmful here and caused a real
  # failure: Lightsail refuses to create a deployment while another is still
  # rolling out, and cancelling a run mid-rollout does not cancel the
  # deployment it already created on AWS. The cancelled run left a live
  # deployment in flight, and the run that superseded it then failed at
  # `create-container-service-deployment` -- looking exactly like a pipeline
  # bug when it was really self-inflicted contention.
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  LIGHTSAIL_SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE_NAME }}
  LIGHTSAIL_CONTAINER_NAME: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned below the Docker image's 3.14 on purpose: actions/setup-python
          # resolves versions against actions/python-versions' manifest, which
          # doesn't have 3.14 yet (see actions/setup-python#1313) -- this step
          # only runs pytest/alembic on the runner itself, never the production
          # container (that pulls python:3.14-slim-bookworm straight from Docker
          # Hub in the Dockerfile, a separate path this doesn't touch).
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt itself (-r), plus
        # pytest/pytest-asyncio -- neither of which belongs in the production
        # image, so neither is in requirements.txt proper.
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        # tests/conftest.py supplies syntactically valid dummy settings. Keeping
        # production secrets out of tests prevents a deployment-only setting
        # (for example CORS_ORIGINS) from breaking collection before tests run.
        run: python -m pytest tests/ -q

  migrate:
    needs: test
    runs-on: ubuntu-latest
    # Tests passing is necessary but not sufficient to touch the production
    # database -- this also requires the push to be on main (not a re-run of
    # someone else's branch via workflow_dispatch against the wrong ref).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load environment
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Guarded migration
        # Reads alembic_version first and only advances from a revision it can
        # prove is safe (see scripts/migrate.py's own docstring). Exits
        # non-zero -- failing this job, not silently continuing -- if the
        # database sits somewhere it can't reason about. A deploy that reaches
        # the next job has a database the application code can run against.
        run: python scripts/migrate.py

  # Build, push and deploy are ONE job on purpose.
  #
  # They used to be two (`build-and-push` with an `image_ref` output, then
  # `deploy` consuming it via needs.*.outputs). That silently did not work:
  # the pushed image reference is `:<service-name>.api.<n>`, which embeds
  # LIGHTSAIL_SERVICE_NAME -- and that is a *secret*. GitHub Actions redacts
  # any job output whose value contains a secret ("Outputs containing secrets
  # are redacted on the runner and not sent to GitHub Actions"), so the deploy
  # job received an empty string, every time, with no error anywhere: the push
  # job went green having genuinely resolved a correct value, and the failure
  # surfaced one job later as AWS's opaque `The image field of container "api"
  # cannot be empty`.
  #
  # Keeping it in one job means the value never crosses a job boundary and
  # never passes through the output-redaction path at all. (Renaming the
  # secret to a plain repository variable would also fix it, since the service
  # name isn't actually sensitive -- it's right there in the public
  # *.cs.amazonlightsail.com hostname -- but that needs a change in repo
  # settings, and this file shouldn't depend on someone remembering to make
  # it.)
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        # `aws lightsail push-container-image` shells out to this plugin; the
        # bare AWS CLI command fails without it. No package manager ships it,
        # so this is AWS's own documented install path.
        run: |
          curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Build image
        run: docker build -t memoir-backend:${{ github.sha }} .

      - name: Push image to the Lightsail service's private registry
        # This is NOT ECR -- Lightsail container services have their own
        # per-service image registry, and this command is the only way into it.
        # Note it needs three IAM actions, not just the one its name suggests:
        # CreateContainerServiceRegistryLogin, PushContainerImage and
        # RegisterContainerImage (see deploy/LIGHTSAIL_CI.md).
        run: |
          aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE_NAME" \
            --label api \
            --image "memoir-backend:${{ github.sha }}"

      - name: Load environment
        # Same blob as the test/migrate jobs -- these become the RUNNING
        # container's environment variables, not just CI's.
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Build the deployment spec
        # Written in Python rather than shell string concatenation so a
        # secret value containing a quote or newline can't break the JSON
        # (and can't escape into a shell command either). Reads every
        # variable from process env -- never interpolated into the script
        # text itself, which would put secret values directly into the
        # workflow's rendered step and its log.
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess

          region = os.environ["AWS_REGION"]
          service = os.environ["LIGHTSAIL_SERVICE_NAME"]
          container_name = os.environ["LIGHTSAIL_CONTAINER_NAME"]

          # Resolved in the same step that consumes it, rather than passed in
          # from anywhere: the registry is the authority on what the push
          # produced, the list comes back newest-first, and a value that never
          # leaves this process can't be lost to output redaction (see the
          # comment on this job) or to parsing lightsailctl's stdout.
          image_ref = subprocess.run(
              [
                  "aws", "lightsail", "get-container-images",
                  "--region", region,
                  "--service-name", service,
                  "--query", "containerImages[0].image",
                  "--output", "text",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          if not image_ref or image_ref == "None":
              raise SystemExit(
                  "No container image found for this service immediately after "
                  "a successful push -- refusing to build a deployment spec "
                  "with an empty image field."
              )

          # Safe to log: this is the thing that was empty for three runs, and
          # it is not itself a secret (the service name inside it is masked by
          # the runner anyway).
          print(f"Deploying image: {image_ref}")

          # Every key config.py's Settings() requires, plus the ones that
          # differ between local dev and this production service. Pulled
          # from the SAME env-var set the test/migrate jobs already
          # validated by running the suite against it.
          passthrough_keys = [
              "SUPABASE_URL", "SUPABASE_ANON_KEY", "SUPABASE_SERVICE_ROLE_KEY",
              "DATABASE_URL", "SUPABASE_JWKS_URL", "SUPABASE_BUCKET_NAME",
              "MEDIA_MAX_BYTES", "MEDIA_SIGNED_URL_TTL",
              "GROQ_API_KEY", "GROQ_ORGANIZE_MODEL",
              "GEMINI_API_KEY", "GEMINI_MODEL",
              "ASSEMBLYAI_API_KEY", "DEEPGRAM_API_KEY", "DEEPGRAM_MODEL",
              "AI_REQUEST_TIMEOUT_SECONDS", "AI_MAX_ATTEMPTS_PER_PROVIDER",
              "AI_MAX_CONCURRENCY", "AI_CIRCUIT_FAILURE_THRESHOLD",
              "AI_CIRCUIT_COOLDOWN_SECONDS", "ORGANIZE_PIPELINE_DEADLINE_SECONDS",
              "SHARE_LINK_BASE_URL", "COOKIE_SECURE", "COOKIE_SAMESITE",
              "CORS_ORIGINS", "READER_JWT_SECRET", "WEB_CONCURRENCY",
          ]
          environment = {k: os.environ[k] for k in passthrough_keys if k in os.environ}

          containers = {
              container_name: {
                  "image": image_ref,
                  "ports": {"8000": "HTTP"},
                  "environment": environment,
              }
          }

          public_endpoint = {
              "containerName": container_name,
              "containerPort": 8000,
              "healthCheck": {
                  # Liveness only, same reasoning as the ALB config in
                  # deploy/README.md section 6: a probe that touches
                  # Postgres turns a database blip into every instance being
                  # marked unhealthy and replaced at once.
                  "path": "/health",
                  "successCodes": "200",
                  "intervalSeconds": 10,
                  "timeoutSeconds": 5,
                  "healthyThreshold": 2,
                  "unhealthyThreshold": 3,
              },
          }

          with open("containers.json", "w") as f:
              json.dump(containers, f)
          with open("public-endpoint.json", "w") as f:
              json.dump(public_endpoint, f)
          PYEOF

      - name: Wait for any in-flight deployment to settle
        # Lightsail rejects create-container-service-deployment outright while
        # the service is still DEPLOYING. The workflow's own concurrency group
        # prevents two runs overlapping, but it cannot prevent a deployment
        # started outside this pipeline (a console deploy, or one left in
        # flight by a run that was cancelled mid-rollout) from colliding with
        # this one. Waiting a few minutes is strictly better than failing a
        # deploy that would have worked 60 seconds later.
        #
        # Checks the latest DEPLOYMENT's state, not just the service's. The
        # two diverge: the service can report RUNNING (it is still serving the
        # previous version quite happily) while its newest deployment is still
        # ACTIVATING -- and it is that deployment, not the service, that makes
        # Lightsail reject a new one with "deployment N is in progress".
        # Gating only on the service state is what let this job fail that way.
        run: |
          for attempt in $(seq 1 30); do
            svc=$(aws lightsail get-container-services \
              --region "$AWS_REGION" \
              --service-name "$LIGHTSAIL_SERVICE_NAME" \
              --query 'containerServices[0].state' --output text)
            dep=$(aws lightsail get-container-service-deployments \
              --region "$AWS_REGION" \
              --service-name "$LIGHTSAIL_SERVICE_NAME" \
              --query 'deployments[0].state' --output text 2>/dev/null || echo "NONE")
            if [ "$svc" != "DEPLOYING" ] && [ "$dep" != "ACTIVATING" ]; then
              echo "service: $svc, latest deployment: $dep -- clear to deploy"
              exit 0
            fi
            echo "service: $svc, latest deployment: $dep -- waiting (attempt $attempt/30)"
            sleep 20
          done
          echo "Timed out waiting for an existing deployment to finish." >&2
          exit 1

      - name: Create the deployment
        # Retried despite the pre-flight wait above: the gap between that
        # check and this call is a real race, and AWS rejects the whole call
        # if anything slips into it. A rejection here is a "try again in a
        # moment", not a broken build, so treat it as one -- but only this
        # specific rejection; anything else fails the job immediately.
        run: |
          for attempt in $(seq 1 10); do
            if err=$(aws lightsail create-container-service-deployment \
              --region "$AWS_REGION" \
              --service-name "$LIGHTSAIL_SERVICE_NAME" \
              --containers file://containers.json \
              --public-endpoint file://public-endpoint.json 2>&1); then
              echo "deployment created"
              exit 0
            fi
            echo "$err"
            case "$err" in
              *"is in progress"*)
                echo "another deployment slipped in -- retrying in 20s (attempt $attempt/10)"
                sleep 20
                ;;
              *)
                exit 1
                ;;
            esac
          done
          echo "Gave up creating the deployment after 10 attempts." >&2
          exit 1

      - name: Wait for the new deployment to become active
        # Lightsail keeps serving the previous version while this one boots,
        # so a failure here means "the new version never came up", not an
        # outage -- but it must still fail the job rather than report green
        # on a deploy nobody is actually running.
        run: |
          for attempt in $(seq 1 30); do
            state=$(aws lightsail get-container-services \
              --region "$AWS_REGION" \
              --service-name "$LIGHTSAIL_SERVICE_NAME" \
              --query 'containerServices[0].state' --output text)
            echo "service state: $state (attempt $attempt/30)"
            if [ "$state" = "RUNNING" ]; then
              exit 0
            fi
            if [ "$state" = "DISABLED" ] || [ "$state" = "DEPLOYING_FAILED" ]; then
              echo "Deployment failed to come up (state: $state)." >&2
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for the service to reach RUNNING." >&2
          exit 1

      - name: Post-deploy smoke check
        run: |
          domain=$(aws lightsail get-container-services \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE_NAME" \
            --query 'containerServices[0].url' --output text)
          curl -fsS "${domain%/}/health"

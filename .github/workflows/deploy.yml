name: Test and deploy to Lightsail

# Pushes to main go live automatically once tests pass. There is no separate
# "staging" gate here by design -- the user asked for features to go live
# directly after tests pass, not for a second manual approval step.
#
# Migrations are the one place this pipeline is deliberately NOT a blind
# `alembic upgrade head`: it runs scripts/migrate.py, the guarded runner this
# repo already has (see deploy/README.md section 3). That script refuses to
# advance from any revision it can't prove is safe, so running it
# unattended in CI is safe by construction -- the guard IS the safety
# mechanism, not a human watching the terminal.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Two deploys racing against the same Lightsail service is a lost update on
  # whichever finishes second; this makes a new push cancel an in-flight one
  # rather than run alongside it.
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  LIGHTSAIL_SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE_NAME }}
  LIGHTSAIL_CONTAINER_NAME: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Load environment (secrets -> process env, not a committed file)
        # The repo's own config.py refuses to boot without every one of these
        # set (validate_ai_provider_chain / validate_browser_delivery_settings),
        # so the test suite needs them present even though most tests never
        # touch a network. One secret holding a full .env.production-shaped
        # blob (see backend/.env.production.example) keeps this to one thing
        # to maintain in GitHub instead of thirty.
        #
        # Comments and blank lines are stripped before appending to
        # $GITHUB_ENV, which has no comment syntax of its own -- an
        # unstripped `# ...` line would be parsed as a literal env var name.
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Run test suite
        working-directory: backend
        run: python -m pytest tests/ -q

  migrate:
    needs: test
    runs-on: ubuntu-latest
    # Tests passing is necessary but not sufficient to touch the production
    # database -- this also requires the push to be on main (not a re-run of
    # someone else's branch via workflow_dispatch against the wrong ref).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Load environment
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Guarded migration
        working-directory: backend
        # Reads alembic_version first and only advances from a revision it can
        # prove is safe (see scripts/migrate.py's own docstring). Exits
        # non-zero -- failing this job, not silently continuing -- if the
        # database sits somewhere it can't reason about. A deploy that reaches
        # the next job has a database the application code can run against.
        run: python scripts/migrate.py

  build-and-push:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        # `aws lightsail push-container-image` shells out to this plugin; the
        # bare AWS CLI command fails without it. No package manager ships it,
        # so this is AWS's own documented install path.
        run: |
          curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Build image
        working-directory: backend
        run: docker build -t memoir-backend:${{ github.sha }} .

      - name: Push image to the Lightsail service's private registry
        id: push
        working-directory: backend
        # This is NOT ECR -- Lightsail container services have their own
        # per-service image registry, and this command is the only way into
        # it. The CLI prints the real reference to use in a deployment
        # (service.label.version) to stdout; nothing about that string is
        # predictable ahead of time, so it has to be scraped from the output
        # rather than constructed.
        run: |
          set -o pipefail
          aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE_NAME" \
            --label api \
            --image "memoir-backend:${{ github.sha }}" \
            2>&1 | tee push_output.txt

          image_ref=$(grep -oP '(?<=Refer to this image as ")[^"]+' push_output.txt)
          if [ -z "$image_ref" ]; then
            echo "Could not parse the pushed image reference from lightsailctl output." >&2
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load environment
        # Same blob as the test/migrate jobs -- these become the RUNNING
        # container's environment variables, not just CI's. Masked from logs
        # below rather than relied on to stay off stdout by accident.
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Build the deployment spec
        # Written in Python rather than shell string concatenation so a
        # secret value containing a quote or newline can't break the JSON
        # (and can't escape into a shell command either). Reads every
        # variable from process env -- never interpolated into the script
        # text itself, which would put secret values directly into the
        # workflow's rendered step and its log.
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          image_ref = os.environ["IMAGE_REF"]
          container_name = os.environ["LIGHTSAIL_CONTAINER_NAME"]

          # Every key config.py's Settings() requires, plus the ones that
          # differ between local dev and this production service. Pulled
          # from the SAME env-var set the test/migrate jobs already
          # validated by running the suite against it.
          passthrough_keys = [
              "SUPABASE_URL", "SUPABASE_ANON_KEY", "SUPABASE_SERVICE_ROLE_KEY",
              "DATABASE_URL", "SUPABASE_JWKS_URL", "SUPABASE_BUCKET_NAME",
              "MEDIA_MAX_BYTES", "MEDIA_SIGNED_URL_TTL",
              "GROQ_API_KEY", "GROQ_ORGANIZE_MODEL",
              "GEMINI_API_KEY", "GEMINI_MODEL",
              "ASSEMBLYAI_API_KEY", "DEEPGRAM_API_KEY", "DEEPGRAM_MODEL",
              "AI_REQUEST_TIMEOUT_SECONDS", "AI_MAX_ATTEMPTS_PER_PROVIDER",
              "AI_MAX_CONCURRENCY", "AI_CIRCUIT_FAILURE_THRESHOLD",
              "AI_CIRCUIT_COOLDOWN_SECONDS", "ORGANIZE_PIPELINE_DEADLINE_SECONDS",
              "SHARE_LINK_BASE_URL", "COOKIE_SECURE", "COOKIE_SAMESITE",
              "CORS_ORIGINS", "READER_JWT_SECRET", "WEB_CONCURRENCY",
          ]
          environment = {k: os.environ[k] for k in passthrough_keys if k in os.environ}

          containers = {
              container_name: {
                  "image": image_ref,
                  "ports": {"8000": "HTTP"},
                  "environment": environment,
              }
          }

          public_endpoint = {
              "containerName": container_name,
              "containerPort": 8000,
              "healthCheck": {
                  # Liveness only, same reasoning as the ALB config in
                  # deploy/README.md section 6: a probe that touches
                  # Postgres turns a database blip into every instance being
                  # marked unhealthy and replaced at once.
                  "path": "/health",
                  "successCodes": "200",
                  "intervalSeconds": 10,
                  "timeoutSeconds": 5,
                  "healthyThreshold": 2,
                  "unhealthyThreshold": 3,
              },
          }

          with open("containers.json", "w") as f:
              json.dump(containers, f)
          with open("public-endpoint.json", "w") as f:
              json.dump(public_endpoint, f)
          PYEOF
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}

      - name: Create the deployment
        run: |
          aws lightsail create-container-service-deployment \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE_NAME" \
            --containers file://containers.json \
            --public-endpoint file://public-endpoint.json

      - name: Wait for the new deployment to become active
        # Lightsail keeps serving the previous version while this one boots,
        # so a failure here means "the new version never came up", not an
        # outage -- but it must still fail the job rather than report green
        # on a deploy nobody is actually running.
        run: |
          for attempt in $(seq 1 30); do
            state=$(aws lightsail get-container-services \
              --region "$AWS_REGION" \
              --service-name "$LIGHTSAIL_SERVICE_NAME" \
              --query 'containerServices[0].state' --output text)
            echo "service state: $state (attempt $attempt/30)"
            if [ "$state" = "RUNNING" ]; then
              exit 0
            fi
            if [ "$state" = "DISABLED" ] || [ "$state" = "DEPLOYING_FAILED" ]; then
              echo "Deployment failed to come up (state: $state)." >&2
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for the service to reach RUNNING." >&2
          exit 1

      - name: Post-deploy smoke check
        run: |
          domain=$(aws lightsail get-container-services \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE_NAME" \
            --query 'containerServices[0].url' --output text)
          curl -fsS "${domain%/}/health"

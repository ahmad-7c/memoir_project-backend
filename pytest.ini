[pytest]
testpaths = tests
# `-W error` is deliberate for two warning families that have both been load-
# bearing bugs in this codebase:
#   * SyntaxWarning from a malformed docstring escape, which is a typo in a
#     comment and nothing else until Python decides to make it an error.
#   * The pydantic `orm_mode`/`from_attributes` rename, which appears in
#     third-party model definitions we do not control. Those are filtered in
#     pytest.ini below rather than ignored wholesale, because `error` is what
#     makes the first family visible.
addopts = -ra --strict-markers --strict-config
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    # pydantic-settings / pydantic deprecations we do not control.
    ignore::DeprecationWarning:pkg_resources.*
    ignore:.*orm_mode.*:DeprecationWarning
    # Same rename, emitted as a UserWarning. `(?s)` is required: filterwarnings
    # compiles the message pattern and matches it against the start of the
    # warning, and pydantic's message is multi-line, so `.*` stops at the first
    # newline and never reaches the word it needs to see.
    ignore:(?s).*orm_mode.*:UserWarning
    ignore:.*'protected_names'.*:UserWarning
    # `supabase` 2.12.0 imports the deprecated `gotrue` distribution at module
    # import time, so importing src.integrations.supabase_client raises this
    # before any test can run. Scoped by message rather than by module: a
    # module-scoped `ignore::DeprecationWarning` would also silence every
    # deprecation inside gotrue, and `-W error` is the only reason our own
    # deprecations stay visible. This is third-party noise, not ours, and it
    # disappears when supabase drops gotrue.
    ignore:The \`gotrue\` package is deprecated.*:DeprecationWarning
    # starlette's TestClient warns at import that it wants `httpx2`. Third-party
    # and cosmetic; the suite would otherwise not collect at all under
    # `-W error`. Remove this when the pin moves to httpx2.
    ignore:Using \`httpx\` with \`starlette.testclient\` is deprecated.*
    # anyio deprecates its `anyio.abc` aliases from inside starlette's own
    # module-level type annotations, so importing TestClient trips it. Nothing
    # we can fix from here, and it is not a signal about our code.
    ignore:The anyio\.abc\..* alias is deprecated.*:DeprecationWarning
    # Pydantic's class-based `Config` deprecation. Raised from inside FastAPI and
    # Starlette as well as from one of our own schemas (`src/schemas/comments.py`
    # still uses the v1 style -- migrate it to ConfigDict). Scoped by message so
    # every *other* Pydantic deprecation in our code still raises, which is the
    # point of running with `-W error` at all.
    ignore:Support for class-based \`config\` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
markers =
    migration: exercises Alembic revisions or model/migration parity.
    # Needs a real Postgres. Not autouse, so `-m "not live"` runs the rest of the
    # suite on a machine with no database and loses nothing.
    live: writes to a live database inside a transaction that is always rolled back.
